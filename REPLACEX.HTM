        <SCRIPT TYPE="TEXT/JAVASCRIPT">
            function RUN(type){
                GtE("OUT").value = "";
                var d1 = GtE("INP").value;
                var H = d1.split(/\n/);
                var d2 = GtE("WHAT").value;
                var S = d2.split(/\n/);
                var d3 = GtE("WITH").value;
                var P = d3.split(/\n/);
                var R = "";
                var SK = false;
                var OVSK = false;
                var WH = [];
                var WI = [];
                var WG = 0;
                var WF = -1;
                var CNC = "";
                var CNN = [];
                var CNT = 0;
                for (var g = 0; g < H.length; g++){
                    var A = "";
                    if (CNC != "")
                        A = "%nn?";
                    if (H[g].trim().startsWith("%n?", 0)){
                        CNC += ""+A+"%n?";
                        CNN.push(H[g]);
                    }
                    else{
                        CNC += ""+A+""+H[g];
                        CNN.push("");
                    }
                }
                for (var g = WG; g < S.length; g++){
                    var C = false;
                    if (S[g].trim().startsWith("%+?", 0) || S[g].trim().startsWith("%-?", 0)){
                        S[g].replaceAll("%+?", "%+?");
                        S[g].replaceAll("%-?", "%+?");
                    }
                    else if (S[g].trim().endsWith("%+?") || S[g].trim().endsWith("%-?")){
                        S[g].replaceAll("%+?", "%+?");
                        S[g].replaceAll("%-?", "%+?");
                        C = true;
                    }
                    if (g+1 < S.length){
                        if (S[g+1].trim().startsWith("%+?", 0) || S[g+1].trim().startsWith("%-?", 0))
                            C = true;
                    }
                    WH.push(S[g]);
                    if (g == S.length-1)
                        C = false;
                    if (C)
                        continue;
                    WF = WF+1;
                    if (WF >= P.length)
                        break;
                    else{
                        WI = [];
                        for (var f = WF; f < P.length; f++){
                            C = false;
                            if (P[f].trim().startsWith("%+?", 0) || P[f].trim().startsWith("%-?", 0)){
                                P[f].replaceAll("%+?", "%+?");
                                P[f].replaceAll("%-?", "%+?");
                            }
                            else if (P[f].trim().endsWith("%+?", 0) || P[f].trim().endsWith("%-?", 0)){
                                P[f].replaceAll("%+?", "%+?");
                                P[f].replaceAll("%-?", "%+?");
                                C = true;
                            }
                            if (f+1 < P.length){
                                if (P[f+1].trim().startsWith("%+?", 0) || P[f+1].trim().startsWith("%-?", 0))
                                    C = true;
                            }
                            WI.push(P[f]);
                            if (f == P.length-1)
                                C = false;
                            if (C)
                                continue;
                        }
                    }
                    
                    for (var i = WH.length-1; i >= 0; i--){
                        var W = "";
                        var E = "";
 //                       for (var j = 0; j < Math.max(WH.length, WI.length); j++){
                        for (var j = 0; j < Math.min(WH.length, WI.length); j++){
                            if (j > i){
                                if (j < WH.length)
                                    W += "%nn?";
                                E += "%nn?";
                            }
                            if (j < WH.length)
                                W += WH[j];
                            if (j < WI.length)
                                E += WI[j];
                        }
                        W = W.replaceAll("%+?", "");
                        E = E.replaceAll("%+?", "");
                        var F = E.split("");
                        E = "";
                        for (var j = 0; j < F.length; j++){
                            if (E != "") E += "%nnn?";
                            E += ""+F[j];
                        }
                        if (type){
                            var U = -1;
                            do{
                                U = CNC.toLowerCase().indexOf(W.toLowerCase());
                                if (U > -1){
                                    var AC = CNC.substring(0, U);
                                    var BC = CNC.substring(U+W.length);
                                    CNC = AC+""+E+""+BC;
                                    CNT += 1;
                                }
                            }
                            while(U > -1);
                   //       var REX = new RegExp(W, "ig")
                   //       CNC = CNC.replace(REX, function(x){CNT+=1;return E;});
                        }
                        else
                            CNC = CNC.replaceAll(W, function(x){CNT += 1; return E;});
                    }
                    WH = [];
                    WG = g;
                }
                CNC = CNC.replaceAll("%nnn?", "");
                var CNS = CNC.split("%nn?");
                var R = "";
                for (var i = 0; i < CNS.length; i++){
                    var A = "";
                    if (R.length > 0) A = "\n";
                    if (CNS[i] == "%n?")
                        R += A+""+CNN[i];
                    else if (CNS[i] == "%s?")
                        continue;
                    else
                        R += A+""+CNS[i];
                }
                R = R.replaceAll("%n?", "");
                R = R.replaceAll("%s?", "");
                R = R.replaceAll("%r?", "");
                GtE("OUT").value = R;
                GtE("RECORDS").innerHTML = CNT;
            }
            
            function GtE(id){
                return document.getElementById(id);
            }
